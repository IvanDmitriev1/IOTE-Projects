<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RGB LED Strip Controller</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 1.5rem; background: Canvas; color: CanvasText; }
    main { width: min(100%, 32rem); margin: 0 auto; }
    h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.15; }
    .field { display: grid; gap: 0.5rem; margin: 1.25rem 0; }
    input, select, button { font: inherit; min-height: 2.75rem; }
    input[type="color"] { width: 100%; padding: 0.25rem; }
    .buttons { display: grid; grid-template-columns: 1fr; gap: 0.75rem; margin-top: 1.5rem; }
    button { padding: 0.6rem 1rem; cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.65; }
    #status { min-height: 1.5em; margin-top: 1.25rem; }
    @media (min-width: 28rem) { .buttons { grid-template-columns: repeat(3, 1fr); } }
  </style>
</head>
<body>
  <main>
    <h1>RGB LED Strip Controller</h1>
    <div class="field">
      <label for="color-picker">Color</label>
      <input id="color-picker" type="color" value="#ffffff">
    </div>
    <div class="field">
      <label for="rainbow-direction">Rainbow direction</label>
      <select id="rainbow-direction">
        <option value="1" selected>Forward</option>
        <option value="2">Backward</option>
      </select>
    </div>
    <div class="buttons">
      <button id="set-color" type="button">Set Color</button>
      <button id="turn-off" type="button">Turn Off</button>
      <button id="start-rainbow" type="button">Start Rainbow</button>
    </div>
    <p id="status" role="status" aria-live="polite">Choose a command.</p>
  </main>
  <script>
    const status = document.getElementById('status');
    const commandControls = [...document.querySelectorAll('button, input, select')];

    async function sendCommand(command) {
      commandControls.forEach(control => { control.disabled = true; });
      status.textContent = 'Sending command…';
      try {
        const response = await fetch('/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(command)
        });
        let result;
        try {
          result = await response.json();
        } catch {
          throw new Error('The controller returned an invalid response.');
        }
        if (!response.ok || result.ok !== true) {
          throw new Error(typeof result.error === 'string' ? result.error : 'Command failed.');
        }
        status.textContent = 'Command accepted.';
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : 'Unable to reach the controller.';
      } finally {
        commandControls.forEach(control => { control.disabled = false; });
      }
    }

    document.getElementById('set-color').addEventListener('click', () => {
      const hex = document.getElementById('color-picker').value;
      sendCommand({
        action: 'color',
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
      });
    });
    document.getElementById('turn-off').addEventListener('click', () => {
      sendCommand({ action: 'off' });
    });
    document.getElementById('start-rainbow').addEventListener('click', () => {
      sendCommand({
        action: 'rainbow',
        direction: Number(document.getElementById('rainbow-direction').value)
      });
    });
  </script>
</body>
</html>
